name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, Build & E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack_password
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fintrack:fintrack_password@localhost:5432/fintrack?schema=public
      JWT_SECRET: ci-test-jwt-secret-for-testing-only-32chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-for-testing-only-32chars
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      PORT: 3001
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client & Push schema
        run: |
          pnpm db:generate
          pnpm db:push

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Security Tests
        run: pnpm -r test -- --run

      - name: Build applications
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm --filter @fintrack/web exec playwright install chromium --with-deps

      - name: Start API & Web for E2E
        run: |
          pnpm --filter @fintrack/api start:prod &
          pnpm --filter @fintrack/web start &
          sleep 10

      - name: Run Playwright E2E & Responsive Smoke Tests
        run: pnpm --filter @fintrack/web test:e2e

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/web/test-results/
          retention-days: 7
